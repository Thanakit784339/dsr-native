plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsrnative.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.dsrnative.app'
        // API 29+: ELF TLS (TLSDESC) used by the x18 transition code.
        minSdk 29
        targetSdk 34
        // CI sets GITHUB_RUN_NUMBER, so every GitHub build installs as a newer version.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Optimised native code even in the debug APK (the default Debug build type is -O0, which
                // made everything several times slower). Debug info is kept.
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            }
        }
    }

    // A fixed debug key (checked into the repo; it protects nothing) so every build — local or CI —
    // has the same signature and installs over the previous one instead of failing with
    // "package conflicts with an existing package".
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
